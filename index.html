<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DrAlgo Web</title>
    <script src="wasm_exec.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        textarea { width: 100%; height: 200px; font-family: monospace; }
        .output { border: 1px solid #ccc; padding: 10px; white-space: pre-wrap; background: #f9f9f9; min-height: 100px; font-family: monospace;}
        .controls { margin: 10px 0; }
        .result-container { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 10px; }
        .result-item { flex: 1 1 400px; min-width: 300px; }
        #image-container img { max-width: 100%; height: auto; border: 1px solid #eee; }
    </style>
</head>
<body>
    <h1>DrAlgo</h1>
    <p>Saisissez votre algorithme ci-dessous :</p>
    <textarea id="input" placeholder="entier x, y; x = 5; y = x + 2;"></textarea>
    
    <div class="controls">
        Langage cible : 
        <select id="lang">
            <option value="python">Python</option>
            <option value="puml">PlantUML</option>
        </select>
        <button onclick="translateCode()">Générer</button>
    </div>

    <h3>Résultat :</h3>
    <div class="result-container">
        <div id="image-container" class="result-item"></div>
        <div id="output" class="output result-item"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <script>
        const go = new Go();
        WebAssembly.instantiateStreaming(fetch("main.wasm"), go.importObject).then((result) => {
            go.run(result.instance);
            console.log("WASM DrAlgo prêt");
        });

        function encode64(data) {
            let r = "";
            for (let i = 0; i < data.length; i += 3) {
                if (i + 2 < data.length) {
                    r += append3bytes(data.charCodeAt(i), data.charCodeAt(i + 1), data.charCodeAt(i + 2));
                } else if (i + 1 < data.length) {
                    r += append3bytes(data.charCodeAt(i), data.charCodeAt(i + 1), 0);
                } else {
                    r += append3bytes(data.charCodeAt(i), 0, 0);
                }
            }
            return r;
        }

        function append3bytes(b1, b2, b3) {
            const c1 = b1 >> 2;
            const c2 = ((b1 & 0x3) << 4) | (b2 >> 4);
            const c3 = ((b2 & 0xF) << 2) | (b3 >> 6);
            const c4 = b3 & 0x3F;
            let r = "";
            r += encode6bit(c1 & 0x3F);
            r += encode6bit(c2 & 0x3F);
            r += encode6bit(c3 & 0x3F);
            r += encode6bit(c4 & 0x3F);
            return r;
        }

        function encode6bit(b) {
            if (b < 10) return String.fromCharCode(48 + b);
            b -= 10;
            if (b < 26) return String.fromCharCode(65 + b);
            b -= 26;
            if (b < 26) return String.fromCharCode(97 + b);
            b -= 26;
            if (b === 0) return '-';
            if (b === 1) return '_';
            return '?';
        }

        function compress(s) {
            // Utilisation de pako pour le deflate compatible PlantUML (RAW deflate)
            const data = encodeURIComponent(s);
            const bytes = new TextEncoder().encode(s);
            const compressed = pako.deflateRaw(bytes, { level: 9 });
            let binary = "";
            for (let i = 0; i < compressed.byteLength; i++) {
                binary += String.fromCharCode(compressed[i]);
            }
            return encode64(binary);
        }

        function translateCode() {
            const input = document.getElementById("input").value;
            const lang = document.getElementById("lang").value;
            const outputDiv = document.getElementById("output");
            const imgContainer = document.getElementById("image-container");
            
            imgContainer.innerHTML = ""; // Reset image

            if (typeof dralgoTranslate === "function") {
                const result = dralgoTranslate(input, lang);
                outputDiv.textContent = result;

                if ((lang === "puml" || lang === "plantuml") && !result.startsWith("Erreur")) {
                    const encoded = compress(result);
                    const url = "https://www.plantuml.com/plantuml/svg/" + encoded;
                    imgContainer.innerHTML = `<h4>Diagramme généré :</h4><img src="${url}" alt="PlantUML Diagram">`;
                }
            } else {
                alert("Le module WebAssembly n'est pas encore prêt.");
            }
        }
    </script>
</body>
</html>
